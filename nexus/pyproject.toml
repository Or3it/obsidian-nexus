[project]
name = "obsidian-nexus"
version = "0.1.0"
description = "Local AI orchestration layer for Obsidian — Phase 1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "tenacity>=8.2",
    "uuid-utils>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "watchdog>=4.0",
    "google-genai>=2.3",
    "anthropic>=0.40",
    "ddgs>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
